syntax = "proto3";

// Server-side copy of the contract. The client project keeps its own identical
// copy, so the two projects build and deploy independently.
option csharp_namespace = "ProductGrpc.Protos";

package product;

// The product service definition: a simple CRUD contract.
service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductModel);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc CreateProduct (CreateProductRequest) returns (ProductModel);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductModel);
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
}

message ProductModel {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

message GetProductRequest {
  int32 id = 1;
}

message ListProductsRequest {
  // Optional case-insensitive filter on the product name.
  string name_filter = 1;
}

message ListProductsResponse {
  repeated ProductModel products = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 stock = 4;
}

message UpdateProductRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

message DeleteProductRequest {
  int32 id = 1;
}

message DeleteProductResponse {
  bool success = 1;
}
